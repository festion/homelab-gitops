name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '17'

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Run ESLint (API)
      run: |
        cd api
        npm run lint
        
    - name: Run ESLint (Dashboard)
      run: |
        cd dashboard
        npm run lint
        
    - name: Run Prettier check (API)
      run: |
        cd api
        npm run format:check || echo "Format check not available"
      continue-on-error: true
        
    - name: Run Prettier check (Dashboard)
      run: |
        cd dashboard
        npm run format:check || echo "Format check not available"
      continue-on-error: true
        
    - name: Check TypeScript compilation (API)
      run: |
        cd api
        npx tsc --noEmit || echo "TypeScript check not available for API"
      continue-on-error: true
        
    - name: Check TypeScript compilation (Dashboard)
      run: |
        cd dashboard
        npx tsc --noEmit
        
    - name: Validate package.json (root)
      run: ./scripts/ci-audit-gate.sh . high

    - name: Validate package.json (API)
      run: ./scripts/ci-audit-gate.sh api high

    - name: Validate package.json (Dashboard)
      run: ./scripts/ci-audit-gate.sh dashboard high

    # mcp-servers/ is a first-party workspace (59 tracked files, its own
    # lockfile) that was NEVER gated. It silently accumulated the same three
    # highs the other workspaces were carrying, and they only surfaced because
    # Trivy's fs scan walks the whole tree (ops #2296).
    - name: Validate package.json (mcp-servers)
      run: ./scripts/ci-audit-gate.sh mcp-servers high

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Run unit tests (API)
      run: |
        cd api
        npm run test:unit || npm test
        
    - name: Run unit tests (Dashboard)
      run: |
        cd dashboard
        npm run test:unit || npm test
        
    - name: Generate coverage report (API)
      run: |
        cd api
        npm run test:coverage || echo "Coverage not configured for API"
      continue-on-error: true
        
    - name: Generate coverage report (Dashboard)
      run: |
        cd dashboard
        npm run test:coverage || echo "Coverage not configured for Dashboard"
      continue-on-error: true
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./api/coverage/lcov.info,./dashboard/coverage/lcov.info
        flags: unit-tests
        fail_ci_if_error: false
        
    - name: Check coverage threshold
      run: |
        echo "Coverage threshold check would be implemented here"
        # Implementation would depend on project's coverage tools

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: homelab_gitops_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Setup test database
      run: |
        cd api
        npm run db:migrate:test || echo "Database migration not configured"
        npm run db:seed:test || echo "Database seeding not configured"
      continue-on-error: true
        
    - name: Start MCP servers for testing
      run: |
        if [ -f "./scripts/start-mcp-servers.sh" ]; then
          chmod +x ./scripts/start-mcp-servers.sh
          ./scripts/start-mcp-servers.sh --test &
          sleep 10
        fi
        
    # This step used to be `|| echo ...` AND `continue-on-error: true` -- doubly
    # suppressed, so the job reported success no matter what happened. The
    # underlying non-zero exit was NOT a test failure: the 8 integration tests
    # pass. It came from jest's coverage THRESHOLDS, which are global and cannot
    # be met by running one project in isolation. Suppressing the whole step to
    # silence a coverage gate meant a genuine integration-test regression would
    # also have gone unreported. Running with --coverage=false gates on the
    # thing this job is named for; coverage is enforced by the full test run.
    - name: Run integration tests (API)
      run: |
        cd api
        npm run test:integration -- --coverage=false
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/homelab_gitops_test

    # The "Run integration tests (Dashboard)" step was removed: dashboard has no
    # `test:integration` script, so it errored on every run and was swallowed by
    # the same `|| echo` + continue-on-error. A step that can only ever fail
    # silently is worse than no step. Its unit tests run in the Unit Tests job.
    #
    # NOT wired up here: the ROOT tests/integration suite (`npm run
    # test:integration` at the repo root). It is currently non-functional -- see
    # the header of tests/integration/jest.config.js. Tracked in ops #2271.
        
    - name: Test audit script validation
      run: |
        if [ -f "./scripts/sync_github_repos.sh" ]; then
          chmod +x ./scripts/sync_github_repos.sh
          ./scripts/sync_github_repos.sh --dry-run
        fi
        
    - name: Stop MCP servers
      run: |
        if [ -f "./scripts/stop-mcp-servers.sh" ]; then
          ./scripts/stop-mcp-servers.sh
        fi
      if: always()

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Build API
      run: |
        cd api
        npm run build || echo "Build script not available for API"
        
    - name: Build Dashboard
      run: |
        cd dashboard
        npm run build
        
    - name: Create deployment package
      run: |
        # Write the archive to RUNNER_TEMP so creating it doesn't touch the
        # directory being archived (previously triggered `tar: .: file changed
        # as we read it` exit-1). Move the artifact back afterward so later
        # steps (docker build, upload) see it at the expected path.
        tar -czf "${RUNNER_TEMP}/homelab-gitops-auditor-${{ github.sha }}.tar.gz" \
          --warning=no-file-changed \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='*.tar.gz' \
          --exclude='coverage' \
          --exclude='.nyc_output' \
          .
        mv "${RUNNER_TEMP}/homelab-gitops-auditor-${{ github.sha }}.tar.gz" .
        
    - name: Build Docker image
      run: |
        if [ -f "Dockerfile" ]; then
          docker build -t homelab-gitops-auditor:${{ github.sha }} .
          docker tag homelab-gitops-auditor:${{ github.sha }} homelab-gitops-auditor:latest
        else
          echo "Dockerfile not found, skipping Docker build"
        fi
        
    - name: Save Docker image
      run: |
        if docker images | grep -q homelab-gitops-auditor; then
          docker save homelab-gitops-auditor:${{ github.sha }} | gzip > homelab-gitops-auditor-docker.tar.gz
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: build-artifacts-${{ github.sha }}
        path: |
          homelab-gitops-auditor-${{ github.sha }}.tar.gz
          homelab-gitops-auditor-docker.tar.gz
        retention-days: 1
        if-no-files-found: ignore

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Run dependency audit (root)
      run: ./scripts/ci-audit-gate.sh . high

    - name: Run dependency audit (API)
      run: ./scripts/ci-audit-gate.sh api high

    - name: Run dependency audit (Dashboard)
      run: ./scripts/ci-audit-gate.sh dashboard high

    - name: Run dependency audit (mcp-servers)
      run: ./scripts/ci-audit-gate.sh mcp-servers high
        
    # The two "Check for critical vulnerabilities" steps that used to sit here
    # were removed. They gated on `.metadata.vulnerabilities.high + .critical`
    # for api/ and dashboard/ -- the same question the two "Run dependency
    # audit" steps above already answer, but via a second, allowlist-unaware
    # code path. Two gates on one question, disagreeing about exceptions, is
    # how this job stayed red on an advisory that had already been assessed and
    # documented. scripts/ci-audit-gate.sh is now the single gate.
    #
    # They were also partly dead: `npm audit --json | jq '.advisories'` reads an
    # npm v6 field that is always null on npm v7+, so the intended debug output
    # never printed.
