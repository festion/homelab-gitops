name: Enhanced Security Scanning

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.serena/**'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.serena/**'
      - 'docs/**'
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        
    - name: Run TruffleHog OSS (secret scan)
      env:
        GH_BEFORE: ${{ github.event.before }}
        GH_PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        # Pick a base commit that won't equal HEAD. The marketplace action
        # crashes with "BASE and HEAD are the same" on empty/no-diff pushes,
        # so we drive the CLI directly and fall back to HEAD~10 when no
        # usable diff base is available.
        ZERO_SHA="0000000000000000000000000000000000000000"
        if [ -n "$GH_PR_BASE" ]; then
          BASE_COMMIT="$GH_PR_BASE"
        elif [ -n "$GH_BEFORE" ] && [ "$GH_BEFORE" != "$ZERO_SHA" ]; then
          BASE_COMMIT="$GH_BEFORE"
        else
          BASE_COMMIT="$(git rev-parse HEAD~10 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
        fi
        echo "Scanning from ${BASE_COMMIT} to HEAD"
        docker run --rm -v "$PWD:/repo" ghcr.io/trufflesecurity/trufflehog:latest \
          git file:///repo/ --only-verified --fail \
          --since-commit "$BASE_COMMIT"

  code-security:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        languages: javascript
        config-file: ./.github/codeql/codeql-config.yml

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Build API
      run: |
        cd api
        npm run build || echo "Build script not available for API"
        
    - name: Build Dashboard
      run: |
        cd dashboard
        npm run build
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [secret-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    # This repo ships NOTHING as a container: deploy.yml does `npm run build`
    # then scp/ssh to CT 123 (gitopsdashboard.mgmt.lakehouse.wtf), and there is
    # no Dockerfile anywhere in the tree -- only docker-compose templates that
    # reference prebuilt third-party images.
    #
    # The previous version fabricated a node:20-alpine image here so it always
    # had something to scan. That scanned an artifact which is never built or
    # deployed, and it is why this job has been red since 2026-07-21: the single
    # CRITICAL was CVE-2026-59873 in `tar 6.2.1` at
    # usr/local/lib/node_modules/npm/node_modules/tar -- npm's OWN bundled tar
    # inside the base image, not a dependency of this repo. No dependency work
    # here could ever clear it, which is why it survived PR #194. It also
    # uploaded SARIF, polluting code-scanning with alerts about an image that
    # does not exist.
    #
    # So: scan a real image if one ever exists, and skip honestly if not.
    - name: Build Docker image
      id: image
      run: |
        if [ -f "Dockerfile" ]; then
          docker build -t homelab-gitops-auditor:scan .
          echo "built=true" >> "$GITHUB_OUTPUT"
        else
          echo "built=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No Dockerfile in this repo -- nothing here is containerized (deploy is npm build + rsync to CT 123). Skipping container scan rather than fabricating an image that is never deployed."
        fi
        
    - name: Run Trivy vulnerability scanner
      if: steps.image.outputs.built == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: 'homelab-gitops-auditor:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      if: steps.image.outputs.built == 'true'
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        sarif_file: 'trivy-results.sarif'
        category: container-image
        
    - name: Check for critical vulnerabilities
      if: steps.image.outputs.built == 'true'
      run: |
        CRITICAL=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image --format json homelab-gitops-auditor:scan | \
          jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' 2>/dev/null || echo "0")
        if [ "$CRITICAL" -gt "0" ]; then
          echo "Found $CRITICAL critical vulnerabilities"
          exit 1
        fi

  dependency-fs-scan:
    name: Trivy Filesystem Scan (dependency tree)
    runs-on: ubuntu-latest
    # Repo default_workflow_permissions is "write" (verified via
    # repos/festion/homelab-gitops/actions/permissions/workflow), so
    # security-events: write is already granted -- this block just makes
    # that explicit and future-proofs against the default being tightened
    # later. Scoped to this job only; does not affect any other job here.
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    # Scans the tree that is actually deployed (rsync to CT 123 -- see the
    # container-security job above for why an image-based scan was removed).
    # Trivy's npm scanner reads package-lock.json directly, so this covers
    # every lockfile in the repo (root, api, dashboard, scripts,
    # mcp-servers) with no `npm ci` / node_modules involved -- node_modules
    # is gitignored and never installed in this job, so there is nothing to
    # exclude.
    #
    # Pinning, explicitly:
    #   - trivy-action is pinned to the same SHA already used by the
    #     (dormant) container-security job below, so both agree on the
    #     action version.
    #   - `version:` pins the Trivy CLI binary itself. This repo used to run
    #     an unpinned `aquasec/trivy:latest` in one step alongside this
    #     pinned trivy-action in another, and the two disagreed about
    #     severity -- that "instrument disagreement" cost real debugging
    #     time. There is now exactly one Trivy binary version in this
    #     workflow.
    #   - `scanners: vuln` keeps this job to dependency vulnerabilities only
    #     -- secret scanning already happens in the secret-scan job
    #     (TruffleHog), and running a second secret scanner here risks the
    #     same kind of disagreement.
    #   - `exit-code: '0'` + no `--audit-level`-style gate: this step
    #     REPORTS findings via SARIF to code-scanning, it does not fail the
    #     build. scripts/ci-audit-gate.sh already gates npm advisories for
    #     api/dashboard with a reviewed, expiring allowlist -- a second gate
    #     here that disagrees about exceptions is exactly what left main
    #     permanently red before (PR #196).
    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        vuln-type: 'library'
        scanners: 'vuln'
        version: 'v0.70.0'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        exit-code: '0'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        sarif_file: 'trivy-fs-results.sarif'
        # Distinct category. Both this job and the dormant container job upload
        # tool=Trivy SARIF; without distinct categories each analysis SUPERSEDES
        # the other, so alerts would flap as the two jobs alternate. Harmless
        # today (the container job cannot run — no Dockerfile) but it costs one
        # line to make it safe if a Dockerfile ever lands.
        category: dependency-fs

  dependency-security:
    name: Dependency Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Run npm audit (API)
      run: |
        cd api
        npm audit --audit-level moderate
      continue-on-error: true
        
    - name: Run npm audit (Dashboard)
      run: |
        cd dashboard
        npm audit --audit-level moderate
      continue-on-error: true
        
    - name: Security scan with Snyk (API)
      uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --file=api/package.json --severity-threshold=high
      continue-on-error: true

    - name: Security scan with Snyk (Dashboard)
      uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --file=dashboard/package.json --severity-threshold=high
      continue-on-error: true

  shell-script-security:
    name: Shell Script Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Scan shell scripts with ShellCheck
      run: |
        find scripts -name "*.sh" -exec shellcheck {} \; || true
        find . -maxdepth 1 -name "*.sh" -exec shellcheck {} \; || true
      continue-on-error: true
      
    - name: Check script permissions
      run: |
        echo "Checking for scripts with excessive permissions..."
        find . -name "*.sh" -perm /u+s,g+s,o+w -ls || true

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: homelab_gitops_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
        
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
        
    - name: Setup test database
      run: |
        cd api
        npm run db:migrate:test || echo "Database migration not configured"
        npm run db:seed:test || echo "Database seeding not configured"
      continue-on-error: true
        
    - name: Run security tests (API)
      run: |
        cd api
        npm run test:security || echo "Security tests not configured for API"
      continue-on-error: true
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/homelab_gitops_test
        
    - name: Run security tests (Dashboard)
      run: |
        cd dashboard
        npm run test:security || echo "Security tests not configured for Dashboard"
      continue-on-error: true
        
    - name: Generate security report
      run: |
        cat > security-report.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "scans_completed": [
            "secret_detection",
            "code_analysis",
            "container_security", 
            "dependency_security",
            "shell_script_security",
            "security_tests"
          ],
          "status": "completed"
        }
        EOF
        
    - name: Upload security report
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: security-report-${{ github.sha }}
        path: security-report.json
        retention-days: 30