name: Lint and Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    # Runs before the npm installs on purpose: it needs only bash, wget and
    # node, so it still reports if a dependency install breaks. Placed after
    # setup-node so the script's `node -c api/server.js` check actually
    # executes -- without node on PATH that branch warns and passes.
    - name: Validate the one-line installer
      run: bash test-installer.sh

    # ops #3310. The deploy's failure alarm is an `if: failure()` step, so in
    # production it runs only during the incident that needed it. This suite is
    # the only thing that ever exercises it on a good day. Needs bash, curl and
    # python3 only -- all present on ubuntu-latest -- so it sits here with the
    # installer check rather than behind the npm installs.
    - name: Test the deploy-failure Pushover alarm
      run: bash scripts/tests/test_pushover_notify.sh

    # ops #3347. PR #273 removed release.yml's `deploy-release` job and left two
    # `needs.deploy-release` expressions behind. GitHub does not reject that --
    # the context is simply empty, so the comparison is falsy and the release
    # report would have said "Production: Manual" on every release while
    # deploy.yml was in fact deploying production. release.yml has never run
    # (0 runs, against 209 for deploy.yml), so its first execution would have
    # been a real release. The check has to be static; waiting for a run is
    # waiting for the incident. Needs python3 + pyyaml only, so it sits with the
    # other pre-npm checks.
    - name: Check workflow `needs` references resolve
      run: |
        python3 -m pip install --quiet pyyaml
        python3 scripts/check-workflow-needs.py --self-test
        python3 scripts/check-workflow-needs.py

    # ops #3312. deploy.yml sends its production install step to CT 123 inside a
    # heredoc. Every shellcheck step in this repo reads scripts/*.sh, so the one
    # shell that runs as ROOT ON PRODUCTION is the one shell nothing lints. A
    # dropped backslash turns `cp -a "\$INSTALL_DIR" "\$BACKUP"` into
    # `cp -a "" ""`, which PARSES -- so `bash -n` alone would not catch it and
    # the error surfaces at deploy time.
    #
    # --self-test runs FIRST and on purpose: `bash -n` on an empty string
    # succeeds, so a checker whose extractor silently returned nothing would
    # print a clean pass forever. The self-test asserts it goes red on a
    # dropped backslash before the real run is believed.
    - name: Lint remote heredocs in workflows
      run: |
        python3 scripts/check-workflow-heredocs.py --self-test
        python3 scripts/check-workflow-heredocs.py

    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
    
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
    
    - name: Lint API code
      run: |
        cd api
        npm run lint
    
    - name: Lint Dashboard code
      run: |
        cd dashboard
        npm run lint
    
    - name: TypeScript compilation check
      run: |
        cd dashboard
        npx tsc --noEmit
    
    - name: Test API endpoints
      run: |
        cd api
        npm test
    
    - name: Build Dashboard
      run: |
        cd dashboard
        npm run build
        
    - name: Run audit script validation
      run: |
        bash scripts/sync_github_repos.sh --dry-run
        
    - name: Code quality gate
      run: |
        echo "All linting and tests passed successfully"
