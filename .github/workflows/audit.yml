name: Daily GitOps Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show PowerShell version
        shell: pwsh
        run: |
          Write-Host "PowerShell version:"
          $PSVersionTable.PSVersion

      - name: Run Git Audit Script
        shell: pwsh
        run: |
          # ops #3220: the file is scripts/gitaudit.ps1 (all lowercase). This
          # invocation used ./scripts/GitAudit.ps1 and worked ONLY because
          # windows-latest has a case-insensitive filesystem. On any
          # case-sensitive runner — every Linux image, hosted or self-hosted —
          # the path resolves to nothing, the try/catch below reports it as a
          # generic "Script error", and the real cause (one capital letter)
          # is invisible in the failure. The sibling workflow
          # weekly_audit_email.yml already spells it correctly.
          Write-Host "Running gitaudit.ps1..."
          try {
            ./scripts/gitaudit.ps1 -ErrorAction Stop
            Write-Host "✅ Audit script completed."
          } catch {
            Write-Host "❌ Script error: $($_.Exception.Message)"
            exit 1
          }

      - name: Upload audit report as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-audit-report
          path: output/GitRepoReport.md
          retention-days: 30

      - name: Display audit summary
        shell: pwsh
        run: |
          if (Test-Path "output/GitRepoReport.md") {
            Write-Host "✅ Audit report generated successfully"
            Write-Host "Report location: output/GitRepoReport.md"
          } else {
            Write-Host "❌ Audit report not found"
          }
