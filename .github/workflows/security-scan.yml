name: Security Scan

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.serena/**'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.serena/**'
      - 'docs/**'
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Use Node.js 20.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies (API)
      run: |
        cd api
        npm ci
    
    - name: Install dependencies (Dashboard)
      run: |
        cd dashboard
        npm ci
    
    - name: Run npm audit (API)
      run: |
        cd api
        npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Run npm audit (Dashboard)
      run: |
        cd dashboard
        npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Security scan with Snyk
      uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true
    
    - name: Scan shell scripts with ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        find scripts -name "*.sh" -exec shellcheck {} \;
      continue-on-error: true
    
    - name: Check for secrets in code
      uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
      continue-on-error: true
